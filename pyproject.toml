[project]
name = "speech-worker"
version = "0.1.0"
description = "Recording download, Whisper transcription and reliable ASR delivery."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.13.5,<3",
  "pydantic-settings>=2.14.1,<3",
  "httpx>=0.28.1,<0.29",
  "sqlalchemy[asyncio]>=2.0.50,<2.1",
  "asyncpg>=0.31.0,<0.32",
  "tzdata>=2026.1",
]

[dependency-groups]
dev = [
  "mypy>=2.3.0,<3",
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4.0,<2",
  "ruff>=0.16.0,<0.17",
]

[project.scripts]
speech-worker = "src.presentation.cli.worker:main"
speech-sync-directories = "src.presentation.cli.directory_sync:main"
speech-prune = "src.presentation.cli.prune:main"

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.11.18"

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[tool.pytest.ini_options]
minversion = "9.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=.pytest-tmp -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
disable_error_code = [
  "no-untyped-def",
  "no-untyped-call",
  "attr-defined",
  "type-arg",
  "index",
  "arg-type",
  "call-overload",
  "unused-ignore",
]
